<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regent board</title>
<script>try { var t = localStorage.getItem("regent-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<!--
  Regent board: kanban of the SDD cycle. Static page, no server and no dependencies: it re-reads
  data.js (written next to it by scripts/dashboard.sh) every POLL_MS and re-renders on change.
  The columns follow the "Where am I?" table of /regent:status (Step 3.7) — keep them in sync.
-->
<style>
/* Layout: header with a one-sentence summary, then "Your move" (what waits on the user), then the five SDD
   stages left to right (an empty stage shrinks), the main specs last; the archive is a dense table.
   Ink-navy type on cool paper; brass marks what waits on you; green/amber/red only for state.
   Type: the system UI family on purpose (a local tool that works offline, no font requests);
   monospace only for real commands, hashes and requirement IDs. */
:root {
  --paper: #f4f6f9; --surface: #ffffff; --sunken: #eaedf2; --line: #d8dde6; --line-strong: #b9c1cf;
  --ink: #172033; --muted: #4c576b; --subtle: #667087;
  --brass: #84611a; --brass-soft: #f6eedb; --brass-line: #dcc58f;
  --progress: #34527f; --focus: #2f5bd3;
  --ok: #22703c; --ok-soft: #e2f0e6; --warn: #985800; --warn-soft: #fbeedb; --bad: #b0261f; --bad-soft: #fbe4e2;
  --scrim: rgba(23, 32, 51, .30); --drawer-shadow: -16px 0 40px rgba(23, 32, 51, .16);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1420; --surface: #151d2c; --sunken: #1c2537; --line: #283246; --line-strong: #3a4660;
    --ink: #e6eaf1; --muted: #b0b9c9; --subtle: #8d97ab;
    --brass: #dcb563; --brass-soft: #2a2416; --brass-line: #5e4d28;
    --progress: #8eaad9; --focus: #8fb0ff;
    --ok: #66c68d; --ok-soft: #15281d; --warn: #e8a84a; --warn-soft: #2c2213; --bad: #f37a71; --bad-soft: #321a19;
    --scrim: rgba(0, 0, 0, .5); --drawer-shadow: -16px 0 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1420; --surface: #151d2c; --sunken: #1c2537; --line: #283246; --line-strong: #3a4660;
  --ink: #e6eaf1; --muted: #b0b9c9; --subtle: #8d97ab;
  --brass: #dcb563; --brass-soft: #2a2416; --brass-line: #5e4d28;
  --progress: #8eaad9; --focus: #8fb0ff;
  --ok: #66c68d; --ok-soft: #15281d; --warn: #e8a84a; --warn-soft: #2c2213; --bad: #f37a71; --bad-soft: #321a19;
  --scrim: rgba(0, 0, 0, .5); --drawer-shadow: -16px 0 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: var(--fs-md)/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }
h1, h2, h3, h4 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header */
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px var(--gutter-r) 12px var(--gutter-l); display: grid; gap: 10px; }
.bar1 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font: 700 var(--fs-xl)/1.2 var(--display); letter-spacing: -.01em; }
.brand .proj { font: 400 var(--fs-xl)/1.2 var(--display); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand .branch { font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--line); padding: 0 8px; border-radius: 999px; white-space: nowrap; }
.views { display: flex; background: var(--sunken); padding: 3px; border-radius: 8px; }
.view { border: 0; background: transparent; padding: 4px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: var(--fs-sm); }
.view.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.view .n { font-variant-numeric: tabular-nums; color: var(--subtle); margin-left: 6px; font-weight: 400; }
.tools { display: flex; align-items: center; gap: 8px; }
.tools input { width: 220px; max-width: 46vw; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.tools input::placeholder { color: var(--subtle); }
.theme { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
.theme:hover { color: var(--ink); border-color: var(--line-strong); }
.theme svg { width: 16px; height: 16px; flex: none; }
.bar2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.summary { margin: 0; font-size: var(--fs-lg); color: var(--muted); }
.summary b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.summary .wait { color: var(--brass); }
.stamp { margin-left: auto; color: var(--subtle); font-size: var(--fs-xs); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stamp .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.stamp.stale .dot { background: var(--subtle); }

main { padding: 20px var(--gutter-r) 40px var(--gutter-l); display: grid; gap: 24px; }

/* your move */
.move { background: var(--brass-soft); border: 1px solid var(--brass-line); border-radius: 10px; padding: 14px 16px 6px; }
.move h2 { margin: 0 0 6px; font: 600 var(--fs-lg)/1.3 var(--display); }
.move h2 span { color: var(--brass); font-variant-numeric: tabular-nums; margin-left: 6px; }
.move ol { list-style: none; margin: 0; padding: 0; }
.move li { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(180px, 2fr) minmax(0, 2fr) auto; gap: 6px 16px; align-items: center; padding: 9px 0; border-top: 1px solid var(--brass-line); }
.move li:first-child { border-top: 0; }
.move .who { font-weight: 600; cursor: pointer; overflow-wrap: anywhere; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); }
.move .who:hover { text-decoration: underline; }
.move .why { color: var(--muted); }
.move .why b { font-weight: 600; }
.move .why.bad b { color: var(--bad); } .move .why.warn b { color: var(--warn); } .move .why.you b { color: var(--brass); }
.cmd { font-family: var(--mono); font-size: var(--fs-xs); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; overflow-wrap: anywhere; min-width: 0; }
@media (max-width: 820px) { .move li { grid-template-columns: 1fr auto; } .move .why { grid-column: 1 / -1; } .move .cmd { grid-column: 1; } }

/* board */
.board { display: grid; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
@media (max-width: 640px) { .board { grid-template-columns: minmax(0, 1fr) !important; } }
.lane { min-width: 0; display: grid; gap: 8px; align-content: start; }
.lane-h { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 8px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
.lane-h .step { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 600; background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; }
.lane.has .lane-h { border-bottom-color: var(--line-strong); }
.lane.waits .lane-h .step { background: var(--brass); color: var(--surface); }
.lane-h h2 { margin: 0; font: 600 var(--fs-lg)/1.3 var(--display); }
.lane-h .n { color: var(--subtle); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.lane-h p { grid-column: 2 / -1; margin: 0; color: var(--subtle); font-size: var(--fs-xs); }
.empty { color: var(--subtle); font-size: var(--fs-sm); padding: 6px 0; }

.card { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 10px; cursor: pointer; transition: border-color .12s; min-width: 0; }
.card:hover { border-color: var(--line-strong); }
.card.sel { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.card.waits { border-color: var(--brass-line); }
.status { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 600; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.status.you { color: var(--brass); } .status.bad { color: var(--bad); } .status.warn { color: var(--warn); } .status.ok { color: var(--ok); } .status.muted { color: var(--subtle); }
.card .t { font: 600 15px/1.3 var(--display); overflow-wrap: anywhere; }
.card .sub { color: var(--muted); font-size: var(--fs-sm); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.prog { display: grid; gap: 4px; }
.prog .track { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--progress); border-radius: 2px; }
.prog.full .track i { background: var(--ok); }
.prog .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-xs); color: var(--subtle); font-variant-numeric: tabular-nums; }
.stages { display: flex; gap: 2px; }
.stages i { flex: 1; height: 5px; border-radius: 1px; background: var(--sunken); }
.st-ok { background: var(--ok) !important; } .st-warn { background: var(--warn) !important; } .st-bad { background: var(--bad) !important; } .st-na { background: var(--line) !important; }
.meta { color: var(--subtle); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.meta .cost { color: var(--muted); }
.next { display: flex; align-items: center; gap: 6px; }
.next .cmd { flex: 1; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: var(--fs-xs); padding: 3px 9px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.copy:hover { color: var(--ink); border-color: var(--line-strong); }

.specs h2 { margin: 0 0 8px; font: 600 var(--fs-lg)/1.3 var(--display); }
.specs h2 span { font: 400 var(--fs-xs)/1 var(--mono); color: var(--subtle); margin-left: 8px; }
.specs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.specs li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: var(--fs-sm); }
.specs li span { color: var(--subtle); margin-left: 8px; font-variant-numeric: tabular-nums; }

/* archive */
.arch-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--subtle); font-size: var(--fs-sm); }
.types { display: flex; gap: 6px; flex-wrap: wrap; }
.types button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: var(--fs-sm); cursor: pointer; color: var(--muted); }
.types button .n { color: var(--subtle); margin-left: 6px; font-variant-numeric: tabular-nums; }
.types button.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.arch-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.arch { width: 100%; border-collapse: collapse; }
.arch th { text-align: left; font-size: var(--fs-xs); color: var(--subtle); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.arch td { padding: 8px 12px; border-bottom: 1px solid var(--sunken); vertical-align: top; font-size: var(--fs-sm); }
.arch tr.row { cursor: pointer; }
.arch tr.row:hover td { background: var(--paper); }
.arch tr.row.sel td { background: var(--sunken); }
.arch tr.month td { color: var(--muted); font-weight: 600; padding: 14px 12px 6px; border-bottom: 1px solid var(--line); }
.arch .nm { font-weight: 600; overflow-wrap: anywhere; }
.arch .sm { display: block; color: var(--subtle); font-size: var(--fs-xs); max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arch .num, .arch .d { font-variant-numeric: tabular-nums; white-space: nowrap; }
.arch .d { color: var(--muted); }
.pill { display: inline-block; font-size: var(--fs-xs); font-weight: 600; padding: 0 8px; border-radius: 999px; line-height: 20px; }
.pill.ok { color: var(--ok); background: var(--ok-soft); } .pill.bad { color: var(--bad); background: var(--bad-soft); } .pill.muted { color: var(--muted); background: var(--sunken); }
.type { color: var(--muted); }
@media (max-width: 820px) { .arch .hide-s { display: none; } .arch .sm { max-width: 60vw; } }
.more { width: 100%; padding: 8px; border: 1px dashed var(--line-strong); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: var(--fs-sm); }
.loading { color: var(--muted); padding: 20px 0; }
.notice { max-width: 640px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; }
.notice h2 { margin-top: 0; font: 600 var(--fs-lg)/1.3 var(--display); }

/* drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.on { opacity: 1; pointer-events: auto; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100vw); background: var(--surface); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; box-shadow: var(--drawer-shadow); padding-right: env(safe-area-inset-right, 0px); }
aside.on { transform: none; }
aside:not(.on) { pointer-events: none; }
.dr-h { padding: 18px 22px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.dr-top { display: flex; align-items: flex-start; gap: 12px; }
.dr-top > div { display: grid; gap: 4px; min-width: 0; }
.dr-top h2 { margin: 0; font: 600 var(--fs-xl)/1.25 var(--display); overflow-wrap: anywhere; }
.dr-top .x { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: var(--fs-sm); cursor: pointer; color: var(--muted); padding: 4px 10px; }
.dr-meta { color: var(--subtle); font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.tab { border: 0; background: transparent; padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); white-space: nowrap; font-size: var(--fs-sm); }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.dr-b { flex: 1; overflow-y: auto; padding: 20px 22px 48px; }
.sec { margin-bottom: 26px; }
.sec > h3 { font: 600 var(--fs-lg)/1.3 var(--display); margin: 0 0 10px; }
.sec > h3 span { color: var(--subtle); font: 400 var(--fs-sm)/1 var(--sans); margin-left: 8px; font-variant-numeric: tabular-nums; }
.cycle { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; list-style: none; margin: 0; padding: 0; counter-reset: step; }
.cycle li { counter-increment: step; font-size: var(--fs-xs); color: var(--subtle); padding: 6px 0 0; border-top: 3px solid var(--line); }
.cycle li::before { content: counter(step) " "; font-variant-numeric: tabular-nums; }
.cycle li.past { color: var(--muted); border-top-color: var(--ok); }
.cycle li.now { color: var(--ink); font-weight: 600; border-top-color: var(--brass); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { position: relative; padding: 0 0 14px 24px; }
.tl li::before { content: ""; position: absolute; left: 3px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); }
.tl li::after { content: ""; position: absolute; left: 8px; top: 19px; bottom: 0; width: 1px; background: var(--line); }
.tl li:last-child::after { display: none; }
.tl li.k-ok::before { border-color: var(--ok); background: var(--ok); }
.tl li.k-bad::before { border-color: var(--bad); background: var(--bad); }
.tl li.k-you::before { border-color: var(--brass); background: var(--brass); }
.tl li.k-commit::before { border-color: var(--progress); }
.tl .d { font-size: var(--fs-xs); color: var(--subtle); margin-right: 8px; font-variant-numeric: tabular-nums; }
.tl .w { font-weight: 600; }
.tl .s { display: block; color: var(--muted); font-size: var(--fs-sm); }
.tasks { list-style: none; margin: 0; padding: 0; }
.tasks .g { font-size: var(--fs-sm); color: var(--muted); font-weight: 600; margin: 12px 0 2px; }
.task { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--sunken); align-items: baseline; }
.task .box { flex: none; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; position: relative; top: 3px; color: var(--surface); }
.task.done .box { background: var(--ok); border-color: var(--ok); }
.task .tt { flex: 1; min-width: 0; }
.task .id { font-family: var(--mono); font-size: var(--fs-xs); color: var(--subtle); margin-right: 8px; }
.task .tg { font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--sunken); color: var(--muted); margin-right: 8px; }
.task .r { display: block; font-size: var(--fs-xs); color: var(--subtle); }
.task .h { font-family: var(--mono); font-size: var(--fs-xs); color: var(--subtle); flex: none; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
.vst { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: var(--fs-sm); }
.vst b { display: block; font-weight: 600; }
.vst span { color: var(--muted); font-size: var(--fs-xs); }
.vst.ok { border-left: 3px solid var(--ok); } .vst.warn { border-left: 3px solid var(--warn); } .vst.bad { border-left: 3px solid var(--bad); } .vst.na { border-left: 3px solid var(--line); }

/* usage tab */
.usec { overflow-x: auto; }
.usec h4 { font: 600 var(--fs-md)/1.3 var(--display); margin: 20px 0 6px; }
.ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ut { padding: 8px 12px; border-right: 1px solid var(--sunken); border-bottom: 1px solid var(--sunken); }
.ut b { display: block; font: 600 var(--fs-lg)/1.3 var(--display); font-variant-numeric: tabular-nums; }
.ut span { color: var(--subtle); font-size: var(--fs-xs); }
.ut.lead b { color: var(--brass); }
.utab { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
.utab th, .utab td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--sunken); white-space: nowrap; }
.utab th { color: var(--subtle); font-weight: 600; }
.utab td.n, .utab th.n { text-align: right; font-variant-numeric: tabular-nums; }
.note { color: var(--subtle); font-size: var(--fs-xs); margin: 10px 0 0; max-width: 72ch; }

/* rendered markdown */
.md { overflow-wrap: anywhere; max-width: 78ch; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.3em 0 .5em; line-height: 1.25; font-family: var(--display); }
.md h1 { font-size: var(--fs-xl); margin-top: 0; } .md h2 { font-size: var(--fs-lg); padding-bottom: 4px; border-bottom: 1px solid var(--line); } .md h3 { font-size: 15px; } .md h4, .md h5, .md h6 { font-size: var(--fs-md); color: var(--muted); }
.md p { margin: .5em 0 .9em; }
.md pre { background: var(--sunken); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.md pre code { font-size: var(--fs-xs); }
.md :not(pre) > code { background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
.md blockquote { margin: .6em 0; padding: 2px 12px; border-left: 3px solid var(--line-strong); color: var(--muted); }
.md table { border-collapse: collapse; margin: .6em 0 1em; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; font-size: var(--fs-sm); }
.md th { background: var(--sunken); font-weight: 600; }
.md ul, .md ol { margin: .4em 0 .9em; padding-left: 0; list-style: none; }
.md li { position: relative; padding-left: calc(18px + var(--ind, 0) * 18px); margin: 3px 0; }

// ---------- helpers ----------
function esc(s) {

// Field value like sdd-check.sh meta_field: "| Field | value |" or "Field: value"; first word unless it has a "/".
function meta(src, field) {

    const line = raw.replace(/\r$/, "").replace(/[*`]/g, "");
    let m = line.match(new RegExp("^\\|\\s*" + field + "\\s*\\|([^|]*)\\|"));
    if (!m) m = line.match(new RegExp("^" + field + ":\\s(.*)$"));
    if (m) { const v = m[1].trim(); return v.includes("/") ? v : v.split(/\s+/)[0]; }

}
function days(a, b) {

}
function stripComments(src) { return src.replace(/<!--[\s\S]*?-->/g, ""); }
function plural2(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }

  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;

// ---------- usage (scripts/usage.sh: R/M records live, usage.md in the archive) ----------
// One shape for both: total (numbers), runs and models (display strings).
function usageMap(txt) {
  const runs = {}, by = {}, lines = (txt || "").split("\n").map(l => l.split("\t"));
  let asof = "";
  for (const f of lines) {
    if (f[0] === "P") asof = f[1];
    if (f[0] !== "R") continue;
    runs[f[1]] = { change: f[2], cmd: f[3], ver: f[4], start: +f[6], active: +f[8], prompts: +f[9], calls: 0, tin: 0, tcw: 0, tcr: 0, tout: 0, cost: 0, unknown: false, models: [] };
    (by[f[2]] = by[f[2]] || []).push(runs[f[1]]);
  }
  for (const f of lines) {
    const r = f[0] === "M" && runs[f[1]];
    if (!r) continue;
    const x = { cmd: r.cmd, model: f[2], effort: f[3], agent: f[4], calls: +f[5], tin: +f[6], tcw: +f[7] + +f[8], tcr: +f[9], tout: +f[10], cost: +f[11] };
    r.models.push(x);
    for (const k of ["calls", "tin", "tcw", "tcr", "tout"]) r[k] += x[k];
    if (x.cost < 0) r.unknown = true; else r.cost += x.cost;
  }
  const out = {};
  for (const [ch, rs] of Object.entries(by)) {
    rs.sort((a, b) => a.start - b.start);
    const total = { cost: 0, active: 0, prompts: 0, calls: 0, tin: 0, tcw: 0, tcr: 0, tout: 0, runs: rs.length };
    for (const r of rs) for (const k of ["cost", "active", "prompts", "calls", "tin", "tcw", "tcr", "tout"]) total[k] += r[k];
    total.regent = [...new Set(rs.map(r => r.ver).filter(Boolean))].join("/");
    out[ch] = {
      total, asof, live: true,
      runs: rs.map(r => ({ start: fdate(r.start), cmd: r.cmd, ver: r.ver || "?", active: fdur(r.active), prompts: r.prompts, calls: r.calls, tin: fk(r.tin), tcw: fk(r.tcw), tcr: fk(r.tcr), tout: fk(r.tout), cost: fusd(r.cost) + (r.unknown ? " + ?" : "") })),
      models: rs.flatMap(r => r.models).map(x => ({ cmd: x.cmd, model: x.model, effort: x.effort, agent: x.agent, calls: x.calls, tin: fk(x.tin), tcw: fk(x.tcw), tcr: fk(x.tcr), tout: fk(x.tout), cost: x.cost < 0 ? "?" : fusd(x.cost) })),

function usageFromMd(src) {

      u.runs.map(r => `<tr><td>${esc(String(r.start).slice(5))}</td><td>${cmd(r.cmd)}</td><td>${esc(r.ver)}</td><td class="n">${esc(r.active)}</td><td class="n">${esc(r.prompts)}</td><td class="n">${esc(r.calls)}</td>${tok(r)}</tr>`).join("") + "</tbody></table>";

// ---------- parsing ----------
function parseTasks(src) {
  const out = { list: [], size: "" };
  if (!src) return out;
  let grp = "", fence = false;
  for (const raw of src.split("\n")) {
    const l = raw.replace(/\r$/, "");
    if (/^\s*(```|~~~)/.test(l)) { fence = !fence; continue; }
    if (fence) continue;
    let m = l.match(/^## (.*)$/);
    if (m) { grp = m[1].trim(); continue; }
    m = l.match(/Size:\s*([SML])\b/);
    if (m) out.size = m[1];
    m = l.match(/^\s*- \[(.?)\]\s*(.*)$/);
    if (!m) continue;
    const txt = m[2];
    const id = (txt.match(/T-\d+/) || [""])[0];
    const tag = (txt.match(/\[(BE|FE|DB)\]/) || ["", ""])[1];
    const hash = (txt.match(/commit:\s*([0-9a-f]{7,40})/) || ["", ""])[1];
    const reqs = [...new Set(txt.match(/(REQ|INV)-\d+/g) || [])];
    let title = txt.replace(/^(T-\d+)\s*:?\s*/, "").replace(/\[(BE|FE|DB)\]\s*/, "").replace(/✅.*$/, "");
    title = title.split(/\s+[—–]\s+/)[0].trim();
    out.list.push({ done: m[1] === "x" || m[1] === "X", id, tag, hash, reqs, title, grp });
  }
  return out;
}
function parseStages(src) {
  const out = [];
  if (!src) return out;
  for (const raw of stripComments(src).split("\n")) {
    const m = raw.match(/^\|\s*(\d+)\s*\|([^|]*)\|([^|]*)\|/);
    if (!m) continue;
    const status = m[3].trim();
    out.push({ n: +m[1], name: m[2].trim(), status, k: stageKind(status) });
  }
  return out;
}
function stageKind(s) {
  if (/❌|🔴|FAIL|BLOCK/i.test(s)) return "bad";
  if (/⚠|🟡|WARN/i.test(s)) return "warn";
  if (/✅|PASS|OK/i.test(s)) return "ok";
  if (/N\/A/i.test(s)) return "na";
  return "";
}
function parseDecisions(src) {
  const out = [];
  if (!src) return out;
  const body = stripComments(src);
  const i = body.search(/^## Decisions and assumptions/m);
  if (i < 0) return out;
  const sec = body.slice(i).split(/\n## /)[0];
  for (const raw of sec.split("\n")) {
    const m = raw.match(/^\|\s*(\d{4}-\d{2}-\d{2})\s*\|\s*([A-Z]+)\s*\|([^|]*)\|([^|]*)\|/);
    if (m) out.push({ date: m[1], type: m[2], issue: m[3].trim(), res: m[4].trim() });
  }
  return out;
}
function firstHeading(src) {
  if (!src) return "";
  const m = stripComments(src).match(/^### Summary\s*\n+([^\n#|][^\n]*)/m) || stripComments(src).match(/^### What is the problem\?\s*\n+([^\n#|][^\n]*)/m);
  return m && !/^\[/.test(m[1].trim()) ? m[1].trim() : "";
}

// "sha<TAB>date<TAB>subject" lines → lookup by the first 7 characters (tasks.md records short hashes).
function commitMap(txt) {
  const map = {};
  for (const l of (txt || "").split("\n")) {
    const [h, d, ...s] = l.split("\t");
    if (h && d) map[h.slice(0, 7)] = { date: d, subj: s.join("\t") };
  }
  return { get: (h) => map[(h || "").slice(0, 7)] };

function model(c, commits) {
  const f = {};
  for (const [p, body] of c.files) f[p] = body;
  const p = f["proposal.md"], v = f["verification.md"];
  const tasks = parseTasks(f["tasks.md"]);
  const done = tasks.list.filter(t => t.done).length, total = tasks.list.length;
  const m = {
    key: c.place + "/" + c.dir, c, f, name: c.name, place: c.place,
    type: meta(p, "Type") || meta(p, "Typ"), status: meta(p, "Status"), ticket: meta(p, "Ticket"),
    created: meta(p, "Created"), summary: firstHeading(p),
    tasks, done, total, size: tasks.size, commits,
    verdict: meta(v, "Verdict"), vdate: meta(v, "Date"), vhead: meta(v, "Commit HEAD"),
    stages: parseStages(v), decisions: parseDecisions(p), drift: c.drift || 0,
    // archived: usage.md from /regent:archive; without it (moved by hand) the measurement the hooks kept

  if (m.ticket && (/^(NONE|-)$/i.test(m.ticket) || m.ticket.includes("["))) m.ticket = "";
  if (m.created && !/^\d{4}-\d{2}-\d{2}$/.test(m.created)) m.created = "";
  Object.assign(m, stageOf(m));
  return m;
}

// Mirror of /regent:status Step 3.7 ("Where am I?").
function stageOf(m) {
  const n = m.name;
  if (m.place === "archive") {
    const ab = /Abandoned|Rejected/i.test(m.status);
    return { col: "done", flag: ab ? ["muted", "abandoned"] : null, next: "" };
  }
  if (!m.f["proposal.md"]) return { col: "propose", flag: ["warn", "incomplete"], next: `/regent:propose ${n}` };
  if (m.status === "Draft") return { col: "propose", flag: ["you", "awaits your approval"], next: `/regent:propose ${n}` };
  if (m.status === "Rejected") return { col: "propose", flag: ["bad", "rejected"], next: `/regent:archive ${n} --abandon` };
  if (m.status !== "Approved") return { col: "propose", flag: ["warn", "Status: " + (m.status || "none")], next: `/regent:propose ${n}` };
  if (m.total === 0 || m.done === 0) return { col: "ready", flag: null, next: `/regent:apply ${n}` };
  if (m.done < m.total) {
    const t = m.tasks.list.find(x => !x.done);
    const num = t && t.id ? " --tasks " + String(+t.id.slice(2)) : "";
    return { col: "apply", flag: null, next: `/regent:apply ${n}${num}` };
  }
  if (!m.f["verification.md"]) return { col: "verify", flag: ["you", "unverified"], next: `/regent:verify ${n}` };
  if (m.verdict !== "PASS") return { col: "verify", flag: ["bad", "verification " + (m.verdict || "?")], next: `/regent:verify ${n}` };

// ---------- markdown (escapes first, then a small subset) ----------
function inline(s) {

    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, "$1");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
    t = t.replace(/\b((?:REQ|INV)-\d+(?:\/AC-\d+)?|T-\d+)\b/g, '<span class="ref">$1</span>');
    return t;
  }).join("");
}
function cells(l) { return l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(x => x.trim()); }
function md(src) {
  const L = stripComments(src || "").replace(/\r/g, "").split("\n");
  const out = []; let para = []; let i = 0;
  const flush = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  while (i < L.length) {
    const l = L[i]; let m;
    if ((m = l.match(/^\s*(```|~~~)/))) {
      flush(); const buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith(m[1])) buf.push(L[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }
    if (/^\s*$/.test(l)) { flush(); i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); const n = m[1].length; out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { flush(); out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(l)) {
      flush(); const buf = [];
      while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + md(buf.join("\n")) + "</blockquote>"); continue;
    }
    if (/^\s*\|/.test(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      flush(); const head = cells(l); i += 2; const rows = [];
      while (i < L.length && /^\s*\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push("<table><thead><tr>" + head.map(h => "<th>" + inline(h) + "</th>").join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }

      while (i < L.length) {
        const x = L[i]; const lm = x.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (lm) { items.push({ ind: Math.min(4, Math.floor(lm[1].replace(/\t/g, "  ").length / 2)), mark: lm[2], text: lm[3] }); i++; continue; }
        if (/^\s{2,}\S/.test(x) && items.length) { items[items.length - 1].text += " " + x.trim(); i++; continue; }
        break;
      }
      out.push((ordered ? "<ol>" : "<ul>") + items.map(it => {
        const cb = it.text.match(/^\[(.?)\]\s*(.*)$/);

// ---------- rendering ----------
// What waits on the user, in the words of the action to take.
const WAITS = { you: 1, bad: 1, warn: 1 };
function reason(m) {
  const f = m.flag ? m.flag[1] : "";
  if (f === "awaits your approval") return ["you", "Review the proposal", "and approve it or ask for changes"];
  if (f === "unverified") return ["you", "Run verification", "all tasks are done"];
  if (f === "rejected") return ["bad", "Rejected", "archive it as abandoned or rework the proposal"];
  if (/^verification/.test(f)) return ["bad", "Verification failed", "fix the findings in verification.md"];
  if (f === "code moved after verification") return ["warn", "Code changed after verification", "verify again before archiving"];
  if (f === "incomplete") return ["warn", "No proposal yet", "finish or delete the change"];
  return ["warn", f, ""];
}
function waits(m) { return !!(m.flag && WAITS[m.flag[0]]); }
function layerText(m) {
  const layers = {};
  for (const t of m.tasks.list) { const k = t.tag || "BE"; layers[k] = layers[k] || [0, 0]; layers[k][1]++; if (t.done) layers[k][0]++; }
  return Object.keys(layers).length > 1 ? Object.entries(layers).map(([k, v]) => `${k} ${v[0]}/${v[1]}`).join(", ") : "";
}
function cmdRow(cmd) {
  return `<div class="next"><code class="cmd">${esc(cmd)}</code><button class="copy" type="button" data-copy="${esc(cmd)}">Copy</button></div>`;
}

function card(m) {
  const pct = m.total ? Math.round(100 * m.done / m.total) : 0;
  const status = m.flag ? `<div class="status ${m.flag[0]}">${esc(m.flag[1][0].toUpperCase() + m.flag[1].slice(1))}</div>` : "";
  const prog = m.total ? `<div class="prog${m.done === m.total ? " full" : ""}"><div class="track"><i style="width:${pct}%"></i></div>` +
    `<div class="lbl"><span>${m.done} of ${m.total} tasks</span><span>${esc(layerText(m))}</span></div></div>` : "";
  const stg = m.stages.length ? `<div class="stages" title="Verification stages">${m.stages.map(s => `<i class="st-${s.k || "na"}" title="${esc(s.n + ". " + s.name + ": " + s.status)}"></i>`).join("")}</div>` : "";
  const age = days(m.created, null);
  const meta = [m.type, m.size && "size " + m.size, m.ticket, age !== null && "day " + (age + 1)].filter(Boolean).join(", ");
  const cost = m.usage ? `<span class="cost" title="API-equivalent cost and active time, from the Claude Code transcripts">≈ ${esc(fusd(m.usage.total.cost))} in ${esc(fdur(m.usage.total.active))}</span>` : "";
  return `<div class="card${waits(m) ? " waits" : ""}${state.open === m.key ? " sel" : ""}" role="button" tabindex="0" data-key="${esc(m.key)}">` +
    status + `<div class="t">${esc(m.name)}</div>` + (m.summary ? `<div class="sub">${esc(m.summary)}</div>` : "") + prog + stg +
    (meta || cost ? `<div class="meta">${esc(meta)}${meta && cost ? ", " : ""}${cost}</div>` : "") +
    (m.next && !waits(m) ? cmdRow(m.next) : "") + "</div>";
}

function render() {
  const d = state.data;
  $("proj").textContent = d.project || "";
  document.title = "Regent board · " + (d.project || "");
  const br = $("branch"); br.hidden = !d.branch; br.textContent = d.branch || "";
  const active = state.models;
  const arch = d.archive || [];
  const you = active.filter(waits).length;
  const tDone = active.reduce((a, m) => a + m.done, 0), tAll = active.reduce((a, m) => a + m.total, 0);
  const cost = active.reduce((a, m) => a + (m.usage ? m.usage.total.cost : 0), 0);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  $("summary").innerHTML = !active.length ? "No active changes. Start one with <code>/regent:propose</code>." :
    `<b>${plural(active.length, "active change", "active changes")}</b>` +
    (you ? `, <b class="wait">${you} waiting for you</b>` : ", none waiting for you") +
    (tAll ? `. <b>${tDone} of ${tAll}</b> tasks done` : "") +
    (cost ? `, about <b>${fusd(cost)}</b> of Claude Code so far.` : ".");
  $("acount").textContent = arch.length;
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === state.view));
  $("main").innerHTML = state.view === "archive" ? archiveView(arch) : boardView(active);
  if (state.open) drawer();
}

function matches(q, ...fields) { return !q || fields.join(" ").toLowerCase().includes(q); }

function boardView(active) {
  const q = state.q.trim().toLowerCase();
  const vis = active.filter(m => matches(q, m.name, m.type, m.ticket, m.summary));
  let html = "";
  const rank = { bad: 0, you: 1, warn: 2 };
  const todo = vis.filter(waits).sort((a, b) => rank[a.flag[0]] - rank[b.flag[0]] || a.name.localeCompare(b.name));
  if (todo.length) {
    html += `<section class="move" aria-label="Your move"><h2>Your move<span>${todo.length}</span></h2><ol>` + todo.map(m => {
      const [k, what, how] = reason(m);
      return `<li><button class="who" type="button" data-key="${esc(m.key)}">${esc(m.name)}</button>` +
        `<span class="why ${k}"><b>${esc(what)}</b>${how ? ", " + esc(how) : ""}</span>` +
        `<code class="cmd">${esc(m.next)}</code><button class="copy" type="button" data-copy="${esc(m.next)}">Copy</button></li>`;
    }).join("") + "</ol></section>";
  }
  const lanes = COLUMNS.map(col => ({ col, items: vis.filter(m => m.col === col.id)
    .sort((a, b) => (waits(b) - waits(a)) || a.name.localeCompare(b.name)) }));
  // an empty stage keeps its place in the sequence but gives its width to the others
  const cols = lanes.map(l => l.items.length ? "minmax(0, 1fr)" : "minmax(0, .45fr)").join(" ");
  html += `<div class="board" style="grid-template-columns:${cols}">`;
  lanes.forEach(({ col, items }, i) => {
    html += `<section class="lane${items.length ? " has" : ""}${items.some(waits) ? " waits" : ""}"><div class="lane-h">` +
      `<span class="step">${i + 1}</span><h2>${col.label}</h2><span class="n">${items.length}</span><p>${esc(col.note)}</p></div>` +
      (items.length ? items.map(card).join("") : '<div class="empty">No changes</div>') + "</section>";
  });
  html += "</div>";
  const specs = specIndex(state.data.index || "");
  if (specs.length) {
    html += '<section class="specs"><h2>Main specs<span>ai/specs/</span></h2><ul>' +
      specs.map(s => `<li><b>${esc(s.dom)}</b><span>${plural2(s.req, "requirement")}, ${s.ac} AC</span></li>`).join("") + "</ul></section>";
  }
  return html;
}

const ABANDONED = /Abandoned|Rejected/i;
function archiveView(arch) {
  const q = state.q.trim().toLowerCase();
  const kinds = { "": arch.length };
  for (const a of arch) { const k = ABANDONED.test(a.status) ? "abandoned" : a.type || "other"; kinds[k] = (kinds[k] || 0) + 1; }
  const vis = arch.filter(a => {
    const k = ABANDONED.test(a.status) ? "abandoned" : a.type || "other";
    return (!state.atype || state.atype === k) && matches(q, a.name, a.type, a.ticket, a.summary, a.archived);
  }).sort((a, b) => (a.dir < b.dir ? 1 : a.dir > b.dir ? -1 : 0));
  const shown = vis.slice(0, state.archLimit);
  const label = (k) => (k ? k[0].toUpperCase() + k.slice(1) : "All");
  let html = '<div class="arch-bar"><div class="types">' + Object.keys(kinds).map(k =>
    `<button type="button" class="${state.atype === k ? "on" : ""}" data-atype="${esc(k)}">${esc(label(k))}<span class="n">${kinds[k]}</span></button>`).join("") +
    `</div><span>${vis.length === arch.length ? "" : vis.length + " of "}${plural2(arch.length, "archived change")}, newest first</span></div>`;
  if (!arch.length) return html + '<div class="notice"><h2>No archived changes yet</h2><p><code>/regent:archive</code> moves a closed change to <code>ai/changes/archive/</code>; it shows up here.</p></div>';
  html += '<div class="arch-wrap"><table class="arch"><thead><tr><th>Archived</th><th>Change</th><th class="hide-s">Type</th><th class="hide-s">Ticket</th><th>Tasks</th><th class="hide-s">Verdict</th><th class="hide-s">Took</th><th class="hide-s">Active</th><th>Cost</th><th class="hide-s">Regent</th></tr></thead><tbody>';
  let month = "";
  for (const a of shown) {
    const mo = (a.archived || "").slice(0, 7) || "undated";
    if (mo !== month) { month = mo; html += `<tr class="month"><td colspan="10">${esc(mo)}</td></tr>`; }
    const key = "archive/" + a.dir;
    const ab = ABANDONED.test(a.status);
    const took = days(a.created, a.archived);
    const lu = a.cost === "" && state.usage[a.name];
    const u = a.cost !== "" ? { cost: a.cost, active: a.active, regent: a.regent } : lu ? { cost: lu.total.cost, active: lu.total.active, regent: lu.total.regent, live: true } : null;
    const verdict = ab ? '<span class="pill muted">Abandoned</span>' : a.verdict ? `<span class="pill ${a.verdict === "PASS" ? "ok" : "bad"}">${esc(a.verdict)}</span>` : "";
    html += `<tr class="row${state.open === key ? " sel" : ""}" tabindex="0" data-key="${esc(key)}">` +
      `<td class="d">${esc(a.archived || "—")}</td>` +
      `<td><span class="nm">${esc(a.name)}</span>${a.summary ? `<span class="sm">${esc(a.summary)}</span>` : ""}</td>` +
      `<td class="hide-s type">${esc(a.type || "")}</td>` +
      `<td class="hide-s">${esc(a.ticket && !/^(NONE|-)$/i.test(a.ticket) && !a.ticket.includes("[") ? a.ticket : "")}</td>` +
      `<td class="num">${a.total ? a.done + " of " + a.total : "—"}${a.size ? ", " + esc(a.size) : ""}</td>` +
      `<td class="hide-s">${verdict}</td>` +
      `<td class="hide-s num">${took !== null ? took + " d" : ""}</td>` +
      `<td class="hide-s num">${u ? esc(fdur(u.active)) : ""}</td>` +
      `<td class="num"${u && u.live ? ' title="Measured from the transcripts; no usage.md in the change"' : ""}>${u ? "≈ " + esc(fusd(u.cost)) : ""}</td>` +
      `<td class="hide-s d">${esc(u ? u.regent || "" : "")}</td></tr>`;
  }
  html += "</tbody></table></div>";
  if (vis.length > shown.length) html += `<button class="more" type="button" data-more="1">Show ${Math.min(ARCHIVE_PAGE, vis.length - shown.length)} more (${vis.length - shown.length} left)</button>`;
  return html;
}

function specIndex(txt) {
  const by = {};
  for (const l of txt.split("\n")) {
    const m = l.match(/^([^:\s]+): (REQ|INV)-\d+ .*\(AC: (\d+)\)\s*$/);
    if (!m) continue;
    by[m[1]] = by[m[1]] || { dom: m[1], req: 0, ac: 0 };
    by[m[1]].req++; by[m[1]].ac += +m[3];
  }
  return Object.values(by);
}

function overview(m) {
  const at = CYCLE.findIndex(c => c.id === m.col);
  let h = '<div class="sec"><ol class="cycle" aria-label="SDD cycle">' + CYCLE.map((c, i) => `<li class="${i < at ? "past" : i === at ? "now" : ""}"${i === at ? ' aria-current="step"' : ""}>${c.label}</li>`).join("") + "</ol></div>";
  if (waits(m)) { const [, what, how] = reason(m); h += `<div class="sec"><h3>${esc(what)}</h3><p style="margin:0 0 8px;color:var(--muted)">${esc(how ? how[0].toUpperCase() + how.slice(1) + "." : "")}</p>${cmdRow(m.next)}</div>`; }
  else if (m.next) h += `<div class="sec"><h3>Next step</h3>${cmdRow(m.next)}</div>`;

  const ev = [];
  if (m.created) ev.push({ d: m.created, k: "", w: "Proposal created", s: [m.type, m.ticket].filter(Boolean).join(", ") });
  for (const x of m.decisions) ev.push({ d: x.date, k: x.type === "AMEND" ? "you" : "", w: x.type[0] + x.type.slice(1).toLowerCase(), s: (x.issue ? x.issue + ": " : "") + x.res });
  for (const t of m.tasks.list) {
    if (!t.done) continue;
    const c = t.hash && m.commits.get(t.hash);
    ev.push({ d: c ? c.date : "", k: "commit", w: `${t.id || "Task"} done`, s: (t.title || "") + (t.hash ? `, commit \`${t.hash.slice(0, 7)}\`` + (c ? " " + c.subj : "") : "") });
  }
  if (m.usage) for (const r of m.usage.runs) ev.push({ d: r.start, k: "", w: r.cmd, s: `${r.cost} in ${r.active}, ${r.calls} calls, Regent ${r.ver}` });
  if (m.vdate || m.verdict) ev.push({ d: m.vdate, k: m.verdict === "PASS" ? "ok" : "bad", w: "Verification " + (m.verdict || "?"), s: m.vhead ? "at " + m.vhead.slice(0, 7) : "" });
  if (m.place === "archive") ev.push({ d: m.c.archived, k: "ok", w: /Abandoned|Rejected/i.test(m.status) ? "Abandoned" : "Archived", s: "" });
  else if (waits(m)) ev.push({ d: "", k: "you", w: "Waiting for you", s: reason(m)[1] });
  ev.forEach((e, i) => (e.i = i));
  // a date without a time (verification, a commit day) sorts after the timed runs of that day
  const key = (d) => (d.length === 10 ? d + " 24:00" : d);
  ev.sort((a, b) => (a.d && b.d ? key(a.d).localeCompare(key(b.d)) : 0) || a.i - b.i);
  if (ev.length) h += '<div class="sec"><h3>Timeline</h3><ul class="tl">' + ev.map(e =>
    `<li class="k-${e.k}"><span class="d">${esc(e.d || "—")}</span><span class="w">${esc(e.w)}</span>${e.s ? `<span class="s">${inline(e.s)}</span>` : ""}</li>`).join("") + "</ul></div>";

  if (m.total) {
    let g = null;
    h += `<div class="sec"><h3>Tasks<span>${m.done} of ${m.total} done${m.size ? ", size " + esc(m.size) : ""}</span></h3><ul class="tasks">`;
    for (const t of m.tasks.list) {
      if (t.grp !== g) { g = t.grp; if (g) h += `<li class="g">${esc(g)}</li>`; }
      h += `<li class="task${t.done ? " done" : ""}"><span class="box">${t.done ? "✓" : ""}</span><span class="tt">` +
        (t.id ? `<span class="id">${esc(t.id)}</span>` : "") + (t.tag ? `<span class="tg">${esc(t.tag)}</span>` : "") + esc(t.title) +
        (t.reqs.length ? `<span class="r">${esc(t.reqs.join(", "))}</span>` : "") + "</span>" +
        (t.hash ? `<span class="h">${esc(t.hash.slice(0, 7))}</span>` : "") + "</li>";
    }
    h += "</ul></div>";
  }
  if (m.stages.length) {
    h += `<div class="sec"><h3>Verification<span>${esc(m.verdict || "?")}${m.vdate ? ", " + esc(m.vdate) : ""}</span></h3><div class="vgrid">` +
      m.stages.map(s => `<div class="vst ${s.k}"><b>${s.n}. ${esc(s.name)}</b><span>${esc(s.status)}</span></div>`).join("") + "</div></div>";
  }
  return h;
}

function files(m) {
  const names = Object.keys(m.f).filter(p => !(m.usage && p === "usage.md"));
  const rank = (p) => { const i = FILE_ORDER.indexOf(p); return i >= 0 ? i : p.startsWith("specs/") ? 10 : 20; };
  return names.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
}

// Active changes are in data.js; an archived one comes from archive/<dir>.js, loaded on first open.
function getModel(key) {
  if (!key.startsWith("archive/")) return state.models.find(x => x.key === key) || null;
  const dir = key.slice(8);
  const s = (state.data.archive || []).find(a => a.dir === dir);
  if (!s) return null;
  if (state.amodels[dir]) return state.amodels[dir];
  const det = state.details[dir];
  if (!det) { loadDetail(dir); return { pending: true, s }; }
  if (det.error) return { pending: true, s, error: true };
  return (state.amodels[dir] = model({ name: s.name, dir, place: "archive", archived: s.archived, updated: "", drift: 0, files: det.files }, commitMap(det.commits)));
}
function loadDetail(dir) {
  if (state.loading[dir]) return;
  state.loading[dir] = true;
  const s = document.createElement("script");
  s.src = "archive/" + encodeURIComponent(dir) + ".js?t=" + Date.now();
  s.onload = () => { s.remove(); delete state.loading[dir]; };
  s.onerror = () => { s.remove(); delete state.loading[dir]; state.details[dir] = { error: true }; if (state.open === "archive/" + dir) drawer(); };
  document.head.appendChild(s);
}
window.regentArchive = function (dir, d) {
  state.details[dir] = d;
  if (state.open === "archive/" + dir) drawer();
};

function drawer() {
  if (!state.open) return;
  const m = getModel(state.open);
  const el = $("drawer");
  if (!m) { closeDrawer(); return; }
  if (m.pending) {
    el.innerHTML = `<div class="dr-h"><div class="dr-top"><h2>${esc(m.s.name)}</h2><button class="x" type="button" data-close="1">Close</button></div>` +
      `<div class="dr-meta"><span class="mono">ai/changes/archive/${esc(m.s.dir)}/</span></div></div>` +
      `<div class="dr-b"><div class="loading">${m.error ? "Could not load archive/" + esc(m.s.dir) + ".js — rerun dashboard.sh." : "Loading…"}</div></div>`;
    el.dataset.key = ""; el.classList.add("on"); el.setAttribute("aria-hidden", "false"); $("scrim").classList.add("on");
    return;
  }
  const body = el.querySelector(".dr-b");
  const keep = body && el.dataset.key === m.key && el.dataset.tab === state.tab ? body.scrollTop : 0;
  const fl = files(m);
  const tabs = ["overview", ...(m.usage ? ["usage"] : []), ...fl];
  if (!tabs.includes(state.tab)) state.tab = "overview";
  const content = state.tab === "overview" ? overview(m) : state.tab === "usage" ? usageSection(m.usage) : '<div class="md">' + md(m.f[state.tab]) + "</div>";
  const meta = [m.type, m.ticket, m.status && "Status " + m.status, m.c.updated && "Updated " + m.c.updated].filter(Boolean);
  el.innerHTML = `<div class="dr-h"><div class="dr-top"><div>${m.flag ? `<span class="status ${m.flag[0]}">${esc(m.flag[1][0].toUpperCase() + m.flag[1].slice(1))}</span>` : ""}<h2>${esc(m.name)}</h2></div><button class="x" type="button" data-close="1">Close</button></div>` +
    `<div class="dr-meta">${meta.map(x => `<span>${esc(x)}</span>`).join("")}<span class="mono">ai/changes/${m.place === "archive" ? "archive/" : ""}${esc(m.c.dir)}/</span></div>` +
    `<div class="tabs">` + tabs.map(t => `<button class="tab${t === state.tab ? " on" : ""}" data-tab="${esc(t)}">${t === "overview" ? "Overview" : t === "usage" ? "Usage" : esc(t)}</button>`).join("") + "</div></div>" +
    `<div class="dr-b">${content}</div>`;
  el.dataset.key = m.key; el.dataset.tab = state.tab;
  el.querySelector(".dr-b").scrollTop = keep;
  el.classList.add("on"); el.setAttribute("aria-hidden", "false"); $("scrim").classList.add("on");
}
function openDrawer(key, tab) {
  state.open = key; state.tab = tab || "overview";
  writeHash(); render();
}
function closeDrawer() {
  state.open = null; writeHash();
  $("drawer").classList.remove("on"); $("drawer").setAttribute("aria-hidden", "true"); $("scrim").classList.remove("on");
  document.querySelectorAll(".sel").forEach(c => c.classList.remove("sel"));
}
function writeHash() {
  const p = new URLSearchParams();
  if (state.view !== "board") p.set("v", state.view);
  if (state.open) { p.set("c", state.open); if (state.tab !== "overview") p.set("f", state.tab); }
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("v") === "archive") state.view = "archive";
  if (p.get("c")) { state.open = p.get("c"); state.tab = p.get("f") || "overview"; }
}

function copy(text, el) {
  const done = () => { el.textContent = "Copied"; setTimeout(() => (el.textContent = "Copy"), 1200); };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* nothing to do */ }
    ta.remove();
  }
}

// ---------- events ----------
document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-copy]");
  if (c) { e.stopPropagation(); copy(c.dataset.copy, c); return; }
  if (e.target.closest("[data-close]") || e.target.id === "scrim") { closeDrawer(); return; }
  const t = e.target.closest("[data-tab]");
  if (t) { state.tab = t.dataset.tab; writeHash(); drawer(); return; }
  const v = e.target.closest("[data-view]");
  if (v) { state.view = v.dataset.view; writeHash(); render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-atype]");
  if (a) { state.atype = a.dataset.atype; state.archLimit = ARCHIVE_PAGE; render(); return; }
  if (e.target.closest("[data-more]")) { state.archLimit += ARCHIVE_PAGE; render(); return; }
  const k = e.target.closest("[data-key]");
  if (k) openDrawer(k.dataset.key);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.open) { closeDrawer(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-key]:not(button)")) { e.preventDefault(); e.target.click(); }
});
$("q").addEventListener("input", (e) => { state.q = e.target.value; state.archLimit = ARCHIVE_PAGE; render(); });

// ---------- data ----------
window.regentBoard = function (d) {
  state.loaded = true;
  $("stamp").classList.remove("stale");
  $("stamp").innerHTML = `<span class="dot"></span>Data as of ${esc(d.generated || "")}`;
  if (d.sig && d.sig === state.sig) return;
  state.sig = d.sig || "";
  const asig = JSON.stringify(d.archive || []);
  if (asig !== state.asig) { state.asig = asig; state.details = {}; state.amodels = {}; }
  state.data = d;
  state.usage = usageMap(d.usage);
  const cm = commitMap(d.commits);
  state.models = d.changes.map(c => model(c, cm));
  render();
};
let failed = 0;
function load() {
  const s = document.createElement("script");
  s.src = "data.js?t=" + Date.now();
  s.onload = () => { s.remove(); failed = 0; };
  s.onerror = () => {
    s.remove(); failed++;
    if (!state.loaded) $("main").innerHTML = '<div class="notice"><h2>No board data</h2><p>data.js is missing next to this page. In the project root run:</p><pre><code>bash ${CLAUDE_PLUGIN_ROOT}/scripts/dashboard.sh --open</code></pre><p>or <code>/regent:dashboard</code> in Claude Code.</p></div>';
    else $("stamp").classList.add("stale");
  };
  document.head.appendChild(s);
}
// Theme: Auto follows the system; Light and Dark set data-theme on <html>. Remembered per browser when storage works.
const THEMES = ["auto", "light", "dark"];
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("theme-l").textContent = t[0].toUpperCase() + t.slice(1);
  $("theme").title = t === "auto" ? "Theme follows the system. Click for light." : t === "light" ? "Light theme. Click for dark." : "Dark theme. Click to follow the system.";
}
let theme = "auto";
try { theme = localStorage.getItem("regent-theme") || "auto"; } catch (e) { /* storage blocked: Auto */ }
if (!THEMES.includes(theme)) theme = "auto";
applyTheme(theme);
$("theme").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  applyTheme(theme);
  try { localStorage.setItem("regent-theme", theme); } catch (e) { /* not remembered */ }
});

window.addEventListener("hashchange", () => {
  state.open = null; state.view = "board"; state.tab = "overview"; readHash();
  if (!state.data) return;
  if (!state.open) closeDrawer();
  render();
});
readHash();
load();
setInterval(load, POLL_MS);
</script>
</body>
