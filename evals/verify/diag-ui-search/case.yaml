schema_version: "1.0"
name: verify-diag-ui-search
description: Measurement of /regent:verify on the ui-search change after apply (UI with user data — code-reviewer, qa-engineer, security-auditor).
tags: [verify, verify-diag]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:verify ui-search"
  model: sonnet
  max_turns: 60
  timeout_seconds: 2400
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."
graders:
  - name: verification-written
    type: regex
    target: {source: file, path: ai/changes/ui-search/verification.md}
    pattern: "Verdict: (PASS|FAIL)"
  - name: delegates-code-reviewer
    type: tool_used
    tool: Agent
    input_match: "regent:code-reviewer"
    arm: both
  - name: delegates-qa-engineer
    type: tool_used
    tool: Agent
    input_match: "regent:qa-engineer"
    arm: both
  - name: delegates-security-auditor
    type: tool_used
    tool: Agent
    input_match: "regent:security-auditor"
    arm: both
