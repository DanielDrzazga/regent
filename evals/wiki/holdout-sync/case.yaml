schema_version: "1.0"
name: wiki-holdout-sync
description: sync after two commits — asks about the src/ area pages, anchor at HEAD, pages untouched.
tags: [wiki, wiki-holdout]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:wiki sync"
  model: sonnet
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill, SendMessage]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."

graders:
  - name: src-area-pages
    type: regex
    target: last_message
    pattern: "Title length limit|A note must have a title|Notes are listed newest first"
  - name: proposes-ingest
    type: regex
    target: last_message
    pattern: "ingest"
  # HEAD hash after the scaffold (fixed commit dates) — scaffold.sh checks it in sync mode.
  - name: anchor-at-head
    type: regex
    target: {source: file, path: ai/wiki/Home.md}
    pattern: "last-sync-sha: 99acad5"
  - name: log-sync
    type: regex
    target: {source: file, path: ai/wiki/log.md}
    pattern: "## \\[\\d{4}-\\d{2}-\\d{2}\\] sync"
  - name: pages-untouched
    type: file_exists
    path: "ai/wiki/knowledge/**"
    exists: false
