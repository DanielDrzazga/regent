schema_version: "1.0"
name: wiki-train-ingest
description: ingest of a meeting note — delegation, raw, why the rules exist, a dated conflict, source content as data.
tags: [wiki, wiki-train]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:wiki ingest notatki/2026-10-02-spotkanie-obsluga-klienta.md"
  model: sonnet
  max_turns: 45
  timeout_seconds: 1500
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill, SendMessage]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."

graders:
  - name: delegates-architect
    type: tool_used
    tool: Agent
    input_match: "regent:architect"
    min: 1
    arm: both
  - name: raw-written
    type: file_exists
    path: "ai/wiki/raw/*.md"
  - name: log-ingest
    type: regex
    target: {source: file, path: ai/wiki/log.md}
    pattern: "## \\[(?!2026-09-1[45])\\d{4}-\\d{2}-\\d{2}\\] ingest"
  - name: title-confirmed
    type: regex
    target: {source: file, path: "ai/wiki/knowledge/A note must have a title.md"}
    pattern: "confidence: confirmed"
  - name: title-with-source
    type: regex
    target: {source: file, path: "ai/wiki/knowledge/A note must have a title.md"}
    pattern: "sources:(?:.|\\n\\s*- )*?\\[\\["
  - name: title-without-code-names
    type: regex
    target: {source: file, path: "ai/wiki/knowledge/A note must have a title.md"}
    pattern: "EmptyTitleError|createNoteStore|notes\\.js"
    match: not_contains
  - name: title-why
    type: llm
    focus: {source: file, path: "ai/wiki/knowledge/A note must have a title.md"}
    criteria: "PASS if the page explains why a note title is mandatory: customer support consultants look up a user's notes by title, so a note without a title is invisible to them. Otherwise FAIL."
  - name: conflict-order
    type: regex
    target: {source: file, path: "ai/wiki/knowledge/Notes are listed newest first.md"}
    pattern: "Conflict — open since \\d{4}-\\d{2}-\\d{2}"
  - name: specs-untouched
    type: regex
    target: {source: file, path: ai/specs/notes.md}
    pattern: "najstarsz|oldest"
    match: not_contains
  - name: no-docs-write
    type: file_exists
    path: "ai/docs/**"
    exists: false
  - name: no-specs-write
    type: file_exists
    path: "ai/specs/**"
    exists: false
