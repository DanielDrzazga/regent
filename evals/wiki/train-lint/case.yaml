schema_version: "1.0"
name: wiki-train-lint
description: lint on a vault with planted errors — verdict BLOCK, both errors flagged, nothing written.
tags: [wiki, wiki-train]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:wiki lint"
  model: sonnet
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill, SendMessage]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."

graders:
  - name: verdict-block
    type: regex
    target: last_message
    pattern: "BLOCK"
  - name: flags-confirmed-without-source
    type: regex
    target: last_message
    pattern: "Note export"
  - name: flags-entry-without-file
    type: regex
    target: last_message
    pattern: "Note tags"
  - name: lint-without-write
    type: file_exists
    path: "ai/wiki/**"
    exists: false
