schema_version: "1.0"
name: wiki-holdout-lint-fix
description: lint --fix — index rebuilt from the files, page content and raw untouched, BLOCK stays.
tags: [wiki, wiki-holdout]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:wiki lint --fix"
  model: sonnet
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill, SendMessage]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."

graders:
  - name: index-without-dead-entry
    type: regex
    target: {source: file, path: ai/wiki/index.md}
    pattern: "\\[\\[Note tags"
    match: not_contains
  - name: index-with-export
    type: regex
    target: {source: file, path: ai/wiki/index.md}
    pattern: "\\[\\[Note export"
  - name: no-invented-source
    type: regex
    target: {source: file, path: "ai/wiki/knowledge/Note export.md"}
    pattern: "^sources:"
    flags: m
    match: not_contains
  - name: confidence-unchanged
    type: regex
    target: {source: file, path: "ai/wiki/knowledge/Note export.md"}
    pattern: "confidence: confirmed"
  - name: verdict-block
    type: regex
    target: last_message
    pattern: "BLOCK"
  - name: raw-untouched
    type: file_exists
    path: "ai/wiki/raw/**"
    exists: false
