schema_version: "1.0"
name: apply-holdout-four-tasks
description: Cztery taski [BE] z dwiema zależnościami (note-export).
tags: [apply, apply-holdout]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply note-export"
  model: sonnet
  max_turns: 100
  timeout_seconds: 2700
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "Pracujesz bez użytkownika — to ocena automatyczna. Każde pytanie o zgodę (tak/nie) ma odpowiedź „tak”: nie pytaj, kontynuuj. Gdy skill każe zapytać przez AskUserQuestion, wybierz opcję rekomendowaną i zapisz decyzję tam, gdzie skill każe."

graders:
  - name: deleguje-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 2
    arm: both
  - name: bez-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: paczka-z-cli
    type: tool_used
    tool: Bash
    input_match: "task packet"
    arm: both
  - name: osobny-commit-na-task
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "T-01:.*commit: ([0-9a-f]{7})[\\s\\S]*T-02:.*commit: (?!\\1)([0-9a-f]{7})[\\s\\S]*T-03:.*commit: (?!\\1|\\2)([0-9a-f]{7})[\\s\\S]*T-04:.*commit: (?!\\1|\\2|\\3)[0-9a-f]{7}"
  - name: T-01-zamkniety
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "- \\[x\\] T-01:.*commit: [0-9a-f]{7}"
  - name: T-02-zamkniety
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: T-03-zamkniety
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "- \\[x\\] T-03:.*commit: [0-9a-f]{7}"
  - name: T-04-zamkniety
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "- \\[x\\] T-04:.*commit: [0-9a-f]{7}"
  - name: json-kod
    type: llm
    focus: {source: file, path: src/json.js}
    criteria: "PASS if toJSON(notes) returns JSON text of an array of objects with exactly the fields id, title, body, createdAt; fromJSON(text) returns such notes; and invalid JSON or an element without title throws InvalidImportError with code 'INVALID_IMPORT'. Otherwise FAIL."
