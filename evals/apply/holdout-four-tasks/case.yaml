schema_version: "1.0"
name: apply-holdout-four-tasks
description: Four [BE] tasks with two dependencies (note-export).
tags: [apply, apply-holdout]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply note-export"
  model: sonnet
  max_turns: 100
  timeout_seconds: 2700
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."

graders:
  - name: delegates-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 2
    arm: both
  - name: no-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: separate-commit-per-task
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "T-01:.*commit: ([0-9a-f]{7})[\\s\\S]*T-02:.*commit: (?!\\1)([0-9a-f]{7})[\\s\\S]*T-03:.*commit: (?!\\1|\\2)([0-9a-f]{7})[\\s\\S]*T-04:.*commit: (?!\\1|\\2|\\3)[0-9a-f]{7}"
  - name: T-01-closed
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "- \\[x\\] T-01:.*commit: [0-9a-f]{7}"
  - name: T-02-closed
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: T-03-closed
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "- \\[x\\] T-03:.*commit: [0-9a-f]{7}"
  - name: T-04-closed
    type: regex
    target: {source: file, path: ai/changes/note-export/tasks.md}
    pattern: "- \\[x\\] T-04:.*commit: [0-9a-f]{7}"
  - name: json-code
    type: llm
    focus: {source: file, path: src/json.js}
    criteria: "PASS if toJSON(notes) returns JSON text of an array of objects with exactly the fields id, title, body, createdAt; fromJSON(text) returns such notes; and invalid JSON or an element without title throws InvalidImportError with code 'INVALID_IMPORT'. Otherwise FAIL."
