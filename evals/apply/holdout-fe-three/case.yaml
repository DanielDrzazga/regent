schema_version: "1.0"
name: apply-holdout-fe-three
description: Trzy taski [FE] z jedną zależnością (ui-note-detail).
tags: [apply, apply-holdout, apply-fe-holdout]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply ui-note-detail"
  model: sonnet
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "Pracujesz bez użytkownika — to ocena automatyczna. Każde pytanie o zgodę (tak/nie) ma odpowiedź „tak”: nie pytaj, kontynuuj. Gdy skill każe zapytać przez AskUserQuestion, wybierz opcję rekomendowaną i zapisz decyzję tam, gdzie skill każe."
graders:
  - name: deleguje-frontend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:frontend-dev"
    min: 2
    arm: both
  - name: bez-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 0
    max: 0
    arm: both
  - name: bez-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: paczka-z-cli
    type: tool_used
    tool: Bash
    input_match: "task packet"
    arm: both
  - name: T-01-zamkniety
    type: regex
    target: {source: file, path: ai/changes/ui-note-detail/tasks.md}
    pattern: "- \\[x\\] T-01:.*commit: [0-9a-f]{7}"
  - name: T-02-zamkniety
    type: regex
    target: {source: file, path: ai/changes/ui-note-detail/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: T-03-zamkniety
    type: regex
    target: {source: file, path: ai/changes/ui-note-detail/tasks.md}
    pattern: "- \\[x\\] T-03:.*commit: [0-9a-f]{7}"
  - name: osobny-commit-na-task
    type: regex
    target: {source: file, path: ai/changes/ui-note-detail/tasks.md}
    pattern: "T-01:.*commit: ([0-9a-f]{7})[\\s\\S]*T-02:.*commit: (?!\\1)([0-9a-f]{7})[\\s\\S]*T-03:.*commit: (?!\\1|\\2)[0-9a-f]{7}"
  - name: szczegoly-kod
    type: llm
    focus: {source: file, path: web/note-detail.js}
    criteria: "PASS if renderNoteDetail(note) returns an <article> with the title in <h1>, the date from createdAt as YYYY-MM-DD inside a <time> element and the body text, all text passed through escapeHtml; an empty body shows 'Brak treści'; and the output contains the link <a href=\"#/notes\">Wróć do listy</a>. Otherwise FAIL."
