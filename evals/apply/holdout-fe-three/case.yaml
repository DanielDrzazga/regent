schema_version: "1.0"
name: apply-holdout-fe-three
description: Three [FE] tasks with one dependency (ui-note-detail).
tags: [apply, apply-holdout, apply-fe-holdout]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply ui-note-detail"
  model: sonnet
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."
graders:
  - name: delegates-frontend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:frontend-dev"
    min: 2
    arm: both
  - name: no-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 0
    max: 0
    arm: both
  - name: no-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: T-01-closed
    type: regex
    target: {source: file, path: ai/changes/ui-note-detail/tasks.md}
    pattern: "- \\[x\\] T-01:.*commit: [0-9a-f]{7}"
  - name: T-02-closed
    type: regex
    target: {source: file, path: ai/changes/ui-note-detail/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: T-03-closed
    type: regex
    target: {source: file, path: ai/changes/ui-note-detail/tasks.md}
    pattern: "- \\[x\\] T-03:.*commit: [0-9a-f]{7}"
  - name: separate-commit-per-task
    type: regex
    target: {source: file, path: ai/changes/ui-note-detail/tasks.md}
    pattern: "T-01:.*commit: ([0-9a-f]{7})[\\s\\S]*T-02:.*commit: (?!\\1)([0-9a-f]{7})[\\s\\S]*T-03:.*commit: (?!\\1|\\2)[0-9a-f]{7}"
  - name: detail-code
    type: llm
    focus: {source: file, path: web/note-detail.js}
    criteria: "PASS if renderNoteDetail(note) returns an <article> with the title in <h1>, the date from createdAt as YYYY-MM-DD inside a <time> element and the body text, all text passed through escapeHtml; an empty body shows 'Brak treści'; and the output contains the link <a href=\"#/notes\">Wróć do listy</a>. Otherwise FAIL."
