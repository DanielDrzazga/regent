schema_version: "1.0"
name: apply-train-fe-fullstack
description: Zmiana full-stack [BE] + [FE] z kontraktem API (ui-recent) — FE mockuje HTTP wg kontraktu.
tags: [apply, apply-train, apply-fe-train]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply ui-recent"
  model: sonnet
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "Pracujesz bez użytkownika — to ocena automatyczna. Każde pytanie o zgodę (tak/nie) ma odpowiedź „tak”: nie pytaj, kontynuuj. Gdy skill każe zapytać przez AskUserQuestion, wybierz opcję rekomendowaną i zapisz decyzję tam, gdzie skill każe."
graders:
  - name: deleguje-frontend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:frontend-dev"
    min: 1
    arm: both
  - name: deleguje-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 1
    arm: both
  - name: bez-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: paczka-z-cli
    type: tool_used
    tool: Bash
    input_match: "task packet"
    arm: both
  - name: T-01-zamkniety
    type: regex
    target: {source: file, path: ai/changes/ui-recent/tasks.md}
    pattern: "- \\[x\\] T-01:.*commit: [0-9a-f]{7}"
  - name: T-02-zamkniety
    type: regex
    target: {source: file, path: ai/changes/ui-recent/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: osobny-commit-na-task
    type: regex
    target: {source: file, path: ai/changes/ui-recent/tasks.md}
    pattern: "T-01:.*commit: ([0-9a-f]{7})[\\s\\S]*T-02:.*commit: (?!\\1)[0-9a-f]{7}"
  - name: klient-wg-kontraktu
    type: regex
    target: {source: file, path: web/api-client.js}
    pattern: "getRecentNotes[\\s\\S]*/notes\\?[^\\n]*limit"
  - name: widok-ostatnich
    type: llm
    focus: {source: file, path: web/recent-notes.js}
    criteria: "PASS if loadRecentNotes(api, limit) gets data only through api.getRecentNotes(limit) (no direct fetch call), returns a ready state with notes and total on success and an error state when the API call fails; and renderRecentNotes shows note titles passed through escapeHtml, the text 'Pokazano X z Y', and for the error state an element with role=\"alert\" containing 'Nie udało się wczytać ostatnich notatek'. Otherwise FAIL."
