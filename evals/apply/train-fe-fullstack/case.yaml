schema_version: "1.0"
name: apply-train-fe-fullstack
description: A full-stack [BE] + [FE] change with an API contract (ui-recent) — FE mocks HTTP per the contract.
tags: [apply, apply-train, apply-fe-train]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply ui-recent"
  model: sonnet
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."
graders:
  - name: delegates-frontend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:frontend-dev"
    min: 1
    arm: both
  - name: delegates-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 1
    arm: both
  - name: no-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: T-01-closed
    type: regex
    target: {source: file, path: ai/changes/ui-recent/tasks.md}
    pattern: "- \\[x\\] T-01:.*commit: [0-9a-f]{7}"
  - name: T-02-closed
    type: regex
    target: {source: file, path: ai/changes/ui-recent/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: separate-commit-per-task
    type: regex
    target: {source: file, path: ai/changes/ui-recent/tasks.md}
    pattern: "T-01:.*commit: ([0-9a-f]{7})[\\s\\S]*T-02:.*commit: (?!\\1)[0-9a-f]{7}"
  - name: client-per-contract
    type: regex
    target: {source: file, path: web/api-client.js}
    pattern: "getRecentNotes[\\s\\S]*/notes\\?[^\\n]*limit"
  - name: recent-view
    type: llm
    focus: {source: file, path: web/recent-notes.js}
    criteria: "PASS if loadRecentNotes(api, limit) gets data only through api.getRecentNotes(limit) (no direct fetch call), returns a ready state with notes and total on success and an error state when the API call fails; and renderRecentNotes shows note titles passed through escapeHtml, the text 'Pokazano X z Y', and for the error state an element with role=\"alert\" containing 'Nie udało się wczytać ostatnich notatek'. Otherwise FAIL."
