schema_version: "1.0"
name: apply-train-fe-two
description: Two independent [FE] tasks (ui-search) — routing to frontend-dev, a commit and a trace per task.
tags: [apply, apply-train, apply-fe-train]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply ui-search"
  model: sonnet
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."
graders:
  - name: delegates-frontend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:frontend-dev"
    min: 1
    arm: both
  - name: no-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 0
    max: 0
    arm: both
  - name: no-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: T-01-closed
    type: regex
    target: {source: file, path: ai/changes/ui-search/tasks.md}
    pattern: "- \\[x\\] T-01:.*commit: [0-9a-f]{7}"
  - name: T-02-closed
    type: regex
    target: {source: file, path: ai/changes/ui-search/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: separate-commit-per-task
    type: regex
    target: {source: file, path: ai/changes/ui-search/tasks.md}
    pattern: "T-01:.*commit: ([0-9a-f]{7})[\\s\\S]*T-02:.*commit: (?!\\1)[0-9a-f]{7}"
  - name: red-before-green
    type: regex
    target: trace
    # RED as the node:test spec reporter prints it (ℹ fail N), as TAP prints it (# fail N), or as a test
    # file that fails to load because the module does not exist yet — then a later green run.
    pattern: "(?:(?:#|ℹ) fail [1-9]|ERR_MODULE_NOT_FOUND|AssertionError)[\\s\\S]*(?:#|ℹ) fail 0"
  - name: count-plural-forms
    type: llm
    focus: {source: file, path: web/result-count.js}
    criteria: "PASS if renderResultCount(n) returns an element with role=\"status\" whose text is 'Brak wyników' for 0, '1 notatka' for 1, 'N notatki' for numbers ending in 2-4 except 12-14 (e.g. 2, 3, 22), and 'N notatek' otherwise (e.g. 5, 12, 25). Otherwise FAIL."
