schema_version: "1.0"
name: apply-train-tasks-filter
description: --tasks 2 (note-search) — zrobiony tylko T-02, T-01 nietknięty.
tags: [apply, apply-train]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply note-search --tasks 2"
  model: sonnet
  max_turns: 45
  timeout_seconds: 1500
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "Pracujesz bez użytkownika — to ocena automatyczna. Każde pytanie o zgodę (tak/nie) ma odpowiedź „tak”: nie pytaj, kontynuuj. Gdy skill każe zapytać przez AskUserQuestion, wybierz opcję rekomendowaną i zapisz decyzję tam, gdzie skill każe."

graders:
  - name: deleguje-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 1
    arm: both
  - name: bez-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: paczka-z-cli
    type: tool_used
    tool: Bash
    input_match: "task packet"
    arm: both
  - name: commit-na-task
    type: tool_used
    tool: Bash
    input_match: "git commit"
    min: 1
    arm: both
  - name: T-02-zamkniety
    type: regex
    target: {source: file, path: ai/changes/note-search/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: T-01-nietkniety
    type: regex
    target: {source: file, path: ai/changes/note-search/tasks.md}
    pattern: "- \\[ \\] T-01:"
  - name: bez-search-js
    type: file_exists
    path: src/search.js
    exists: false
  - name: limit-tytulu-kod
    type: llm
    focus: {source: file, path: src/notes.js}
    criteria: "PASS if create() throws TitleTooLongError with code 'TITLE_TOO_LONG' when the trimmed title is longer than 80 characters, accepts a trimmed title of exactly 80 characters, and TitleTooLongError is exported. Otherwise FAIL."
