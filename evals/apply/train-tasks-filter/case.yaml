schema_version: "1.0"
name: apply-train-tasks-filter
description: --tasks 2 (note-search) — only T-02 done, T-01 untouched.
tags: [apply, apply-train]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply note-search --tasks 2"
  model: sonnet
  max_turns: 45
  timeout_seconds: 1500
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."

graders:
  - name: delegates-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 1
    arm: both
  - name: no-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: commit-per-task
    type: tool_used
    tool: Bash
    input_match: " commit "  # also `$G commit` / a full path to git
    min: 1
    arm: both
  - name: T-02-closed
    type: regex
    target: {source: file, path: ai/changes/note-search/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: T-01-untouched
    type: regex
    target: {source: file, path: ai/changes/note-search/tasks.md}
    pattern: "- \\[ \\] T-01:"
  - name: no-search-js
    type: file_exists
    path: src/search.js
    exists: false
  - name: title-limit-code
    type: llm
    focus: {source: file, path: src/notes.js}
    criteria: "PASS if create() throws TitleTooLongError with code 'TITLE_TOO_LONG' when the trimmed title is longer than 80 characters, accepts a trimmed title of exactly 80 characters, and TitleTooLongError is exported. Otherwise FAIL."
