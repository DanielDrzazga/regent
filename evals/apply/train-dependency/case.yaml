schema_version: "1.0"
name: apply-train-dependency
description: T-02 czeka na T-01 (note-archive) — dwie rundy i nowy subagent na każdą, bez SendMessage.
tags: [apply, apply-train]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:apply note-archive"
  model: sonnet
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "Pracujesz bez użytkownika — to ocena automatyczna. Każde pytanie o zgodę (tak/nie) ma odpowiedź „tak”: nie pytaj, kontynuuj. Gdy skill każe zapytać przez AskUserQuestion, wybierz opcję rekomendowaną i zapisz decyzję tam, gdzie skill każe."

graders:
  - name: deleguje-backend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:backend-dev"
    min: 2
    arm: both
  - name: bez-sendmessage
    type: tool_used
    tool: SendMessage
    min: 0
    max: 0
    arm: both
  - name: paczka-z-cli
    type: tool_used
    tool: Bash
    input_match: "task packet"
    arm: both
  - name: commit-na-task
    type: tool_used
    tool: Bash
    input_match: "git commit"
    min: 2
    arm: both
  - name: T-01-zamkniety
    type: regex
    target: {source: file, path: ai/changes/note-archive/tasks.md}
    pattern: "- \\[x\\] T-01:.*commit: [0-9a-f]{7}"
  - name: T-02-zamkniety
    type: regex
    target: {source: file, path: ai/changes/note-archive/tasks.md}
    pattern: "- \\[x\\] T-02:.*commit: [0-9a-f]{7}"
  - name: red-przed-green
    type: regex
    target: trace
    pattern: "# fail [1-9][\\s\\S]*# fail 0"
  - name: archiwizacja-kod
    type: llm
    focus: {source: file, path: src/notes.js}
    criteria: "PASS if this JavaScript note store satisfies all of: archive(id) marks the note archived (archived: true) and returns a copy; a newly created note has archived: false; archiving an unknown id throws NoteNotFoundError with code 'NOTE_NOT_FOUND'; list() leaves out archived notes and list({ includeArchived: true }) includes them. Otherwise FAIL."
