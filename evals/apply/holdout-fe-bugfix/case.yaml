schema_version: "1.0"
name: apply-holdout-fe-bugfix
description: /regent:bugfix in the UI — a title with HTML renders as markup (frontend-dev, regression test).
tags: [apply, apply-holdout, apply-fe-holdout]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:bugfix tytuł notatki z HTML-em (np. <b>Zakupy</b>) wyświetla się na liście notatek jako znaczniki zamiast jako tekst"
  model: sonnet
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "You work without a user — this is an automated evaluation. If `/usr/bin/git` fails with an xcrun cache error (the macOS eval sandbox blocks the Xcode shim), use `/opt/homebrew/bin/git` for every git command. Every yes/no consent question is answered \"yes\": do not ask, continue. When the skill says to ask with AskUserQuestion, pick the recommended option and record the decision where the skill says."
graders:
  - name: delegates-frontend-dev
    type: tool_used
    tool: Agent
    input_match: "regent:frontend-dev"
    min: 1
    arm: both
  - name: commit-fix
    type: tool_used
    tool: Bash
    input_match: "git commit.*fix"
    arm: both
  - name: fix-escape
    type: llm
    focus: {source: file, path: web/note-list.js}
    criteria: "PASS if renderNoteList passes every note title through escapeHtml (or equivalent HTML escaping) before inserting it into the HTML, so a title like '<b>x</b>' is shown as text. Otherwise FAIL."
  - name: regression-test
    type: llm
    focus: {source: file, path: test/web-note-list.test.js}
    criteria: "PASS if the file contains a test that renders a note whose title contains HTML markup (for example <b> or <script>) and asserts that the output contains the escaped text (for example &lt;b&gt;) and not the raw tag. Otherwise FAIL."
