schema_version: "1.0"
name: explore-impact
description: kontrola — pytanie o wpływ zmiany bez grafu kodu (Grep/Glob jak dotąd).
tags: [explore, explore-holdout, code-map-nograph]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/regent:explore impact of removing escapeHtml from web/html.js — which files would need to change?"
  model: sonnet
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Grep, Glob, Bash, Agent, Skill]
  append_system_prompt: "Pracujesz bez użytkownika — to ocena automatyczna. Każde pytanie o zgodę (tak/nie) ma odpowiedź „tak”: nie pytaj, kontynuuj."

graders:
  - name: deleguje-architect
    type: tool_used
    tool: Agent
    input_match: "regent:architect"
    min: 1
  - name: bez-grafu
    type: tool_used
    tool: Bash
    input_match: "graphify"
    min: 0
    max: 0
  - name: wskazuje-note-list
    type: regex
    target: last_message
    pattern: "note-list\\.js"
